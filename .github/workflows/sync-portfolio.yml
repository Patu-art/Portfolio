# Read-only, owner-invoked audit. Publishing is intentionally disabled:
# every production change must be explicitly approved by the repository owner.
name: Preview portfolio sync (manual, no publishing)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-repository-sync-preview
  cancel-in-progress: true
jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout portfolio without write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot browser
        run: |
          npm install --no-save --no-package-lock playwright sharp
          npx playwright install --with-deps chromium
      - name: Verify website title extraction
        run: node --test scripts/test-site-title.mjs
      - name: Generate local-only repository and website previews
        run: node scripts/sync-portfolio.mjs
      - name: Validate generated snapshot and project archive
        env:
          REQUIRE_REFRESHED_PREVIEWS: '1'
        run: |
          node scripts/audit-static.mjs
          node --check js/repo-carousel.js
          node --check scripts/sync-portfolio.mjs
          node scripts/test-portfolio.mjs
      - name: Confirm no production code was published
        run: |
          echo "Preview only. No git push, no write-scoped token, no production updates."
