name: Check glass book portfolio
on:
  push:
    branches: [main]
    paths:
      - 'projects.html'
      - 'js/repo-carousel.js'
      - 'css/repo-carousel.css'
      - 'css/coverflow-v5.css'
      - 'scripts/test-portfolio.mjs'
      - 'scripts/site-title.mjs'
      - 'scripts/test-site-title.mjs'
      - '.github/workflows/check-portfolio.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'projects.html'
      - 'js/main.js'
      - 'js/home-challenge.js'
      - 'js/repo-carousel.js'
      - 'css/animations.css'
      - 'css/repo-carousel.css'
      - 'css/coverflow-v5.css'
      - 'data/projects.json'
      - 'data/repos.json'
      - 'data/repo-preview-config.json'
      - 'scripts/test-portfolio.mjs'
      - 'scripts/site-title.mjs'
      - 'scripts/test-site-title.mjs'
      - '.github/workflows/check-portfolio.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: glass-book-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save --no-package-lock playwright sharp
          npx playwright install --with-deps chromium
      - name: Validate homepage, carousel and published site titles
        run: |
          node --test scripts/test-site-title.mjs
          node --check js/repo-carousel.js
          node --check scripts/test-portfolio.mjs
          node scripts/test-portfolio.mjs
