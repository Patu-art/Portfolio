name: Check glass book portfolio
# Run on every proposed or published change, including workflows, access policy,
# data and configuration. Required checks must never be skipped by path filters.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: glass-book-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save --no-package-lock playwright sharp
          npx playwright install --with-deps chromium
      - name: Validate homepage, carousel, links and published site titles
        run: |
          node scripts/audit-static.mjs
          node --test scripts/test-site-title.mjs
          node --check js/repo-carousel.js
          node --check scripts/test-portfolio.mjs
          node scripts/test-portfolio.mjs
